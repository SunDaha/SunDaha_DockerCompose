# ==================== MongoDB 7.0 配置 ====================

# ---- 存储引擎 ----
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# ---- 网络 ----
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000
  compression:
    compressors: snappy,zstd,zlib

# ---- 安全 ----
security:
  authorization: enabled

# ---- 日志 ----
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen
  verbosity: 0
  component:
    accessControl:
      verbosity: 0
    command:
      verbosity: 0
    query:
      verbosity: 0

# ---- 性能分析 ----
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 200

# ---- 进程管理 ----
processManagement:
  fork: false
  timeZoneInfo: /usr/share/zoneinfo
