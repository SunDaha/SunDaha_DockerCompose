# ==================== Redis 配置 ====================

# ---- 网络 ----
bind 0.0.0.0
protected-mode no
port 6379
timeout 300
tcp-keepalive 60
tcp-backlog 511

# ---- 认证 ----
requirepass SunDaha_8322368

# ---- 内存管理 ----
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---- RDB 持久化 ----
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ---- AOF 持久化 ----
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---- 日志 ----
loglevel notice
logfile ""

# ---- 慢日志 ----
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---- 客户端 ----
maxclients 10000

# ---- 惰性删除（异步释放内存） ----
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
